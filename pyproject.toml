[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "etf-harness"
version = "0.1.0"
description = "Deterministic campaign governance for ETF index research"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "hatchling>=1.27,<2", "editables>=0.5,<1", "pandas-stubs>=2.2,<4"]

[project.scripts]
etf-harness = "etf_harness.cli.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
